<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E1116">
<title>pt.Live — Quản lý bản quyền</title>
<style>
:root{
  --bg:#0E1116; --sf:#151A21; --sf2:#1B222B; --sf3:#232C37;
  --bd:#262E39; --bd2:#334050;
  --tx:#E8ECF1; --mt:#8A94A3; --dim:#5F6A7A;
  --ac:#8B9CFF; --ac-d:#6D7FF0; --on-ac:#0B0F1A;
  --ok:#4CC38A; --wn:#E5A93D; --er:#F26D6D;
  --r:14px; --r-s:10px;
  --mono:ui-monospace,"SF Mono","Cascadia Mono",Consolas,monospace;
  --sans:"Segoe UI Variable","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{background:var(--bg);color-scheme:dark}
body{background:var(--bg);color:var(--tx);font-family:var(--sans);font-size:15px;line-height:1.45;min-height:100vh;min-height:100dvh;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 16px;border-radius:var(--r-s);background:var(--sf2);border:1px solid var(--bd);font-weight:600;font-size:14px;transition:background .15s,border-color .15s,transform .05s}
.btn:hover{background:var(--sf3);border-color:var(--bd2)}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn.primary{background:var(--ac);border-color:var(--ac);color:var(--on-ac)}
.btn.primary:hover{background:var(--ac-d);border-color:var(--ac-d)}
.btn.danger{color:var(--er);border-color:rgba(242,109,109,.35);background:rgba(242,109,109,.06)}
.btn.danger:hover{background:rgba(242,109,109,.14);border-color:var(--er)}
.btn.good{color:var(--ok);border-color:rgba(76,195,138,.4);background:rgba(76,195,138,.08)}
.btn.good:hover{background:rgba(76,195,138,.16);border-color:var(--ok)}
.btn.ghost{background:none;border-color:transparent;color:var(--mt)}
.btn.ghost:hover{color:var(--tx);background:var(--sf2)}
.btn.sm{min-height:36px;padding:0 13px;font-size:13px}
.icon{width:18px;height:18px;flex-shrink:0}

/* ---------- inputs ---------- */
.field{display:block}
.field>span{display:block;font-size:13px;color:var(--mt);margin-bottom:6px}
.input{width:100%;min-height:46px;padding:0 14px;background:var(--bg);border:1px solid var(--bd);border-radius:var(--r-s);font-size:16px;outline:none;transition:border-color .15s,box-shadow .15s}
.input::placeholder{color:var(--dim)}
.input:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(139,156,255,.18)}
.pwrap{position:relative}
.pwrap .input{padding-right:48px}
.pwrap button{position:absolute;right:4px;top:4px;width:38px;height:38px;border-radius:8px;color:var(--mt);display:grid;place-items:center}
.pwrap button:hover{color:var(--tx);background:var(--sf2)}

/* ---------- brand ---------- */
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mark{width:38px;height:38px;border-radius:11px;background:var(--ac);color:var(--on-ac);display:grid;place-items:center;font-weight:800;font-size:15px;letter-spacing:-.5px;flex-shrink:0}
.brand h1{font-size:17px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.brand p{font-size:13px;color:var(--mt)}

/* ---------- login ---------- */
.login{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px 16px}
.login-card{width:100%;max-width:380px;background:var(--sf);border:1px solid var(--bd);border-radius:20px;padding:28px 24px 24px}
.login-card .brand{margin-bottom:24px}
.login-card .btn{width:100%;min-height:48px;margin-top:16px}
.lerr{color:var(--er);font-size:13px;min-height:20px;margin-top:10px}
.rem{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:14px;color:var(--mt);cursor:pointer;user-select:none}
.rem input{width:18px;height:18px;margin:0;accent-color:var(--ac);cursor:pointer;flex-shrink:0}

/* ---------- app shell ---------- */
.bar{position:sticky;top:0;z-index:20;background:rgba(14,17,22,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--bd);padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px}
.bar-in{max-width:1000px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.bar-r{display:flex;gap:6px;flex-shrink:0}
.wrap{max-width:1000px;margin:0 auto;padding:18px 16px calc(40px + env(safe-area-inset-bottom,0px))}

/* ---------- toolbar ---------- */
.tools{display:flex;flex-direction:column;gap:12px;margin-bottom:16px}
.seg{display:flex;gap:4px;padding:4px;background:var(--sf);border:1px solid var(--bd);border-radius:12px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;min-height:38px;padding:0 14px;border-radius:9px;color:var(--mt);font-weight:600;font-size:14px;white-space:nowrap;transition:background .15s,color .15s}
.seg button:hover{color:var(--tx)}
.seg button.on{background:var(--sf3);color:var(--tx);box-shadow:inset 0 0 0 1px var(--bd2)}
.seg .n{display:inline-block;min-width:20px;margin-left:6px;padding:1px 6px;border-radius:999px;background:var(--bg);color:var(--mt);font-size:12px;font-weight:700}
.seg button.on .n{background:var(--ac);color:var(--on-ac)}
.seg button[data-s="pending"] .n.has{background:rgba(229,169,61,.2);color:var(--wn)}
.seg button.on[data-s="pending"] .n.has{background:var(--wn);color:#1A1204}
.search{position:relative}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--dim);pointer-events:none}
.search .input{padding-left:42px;background:var(--sf)}

/* ---------- list ---------- */
.list{display:flex;flex-direction:column;gap:10px}
.row{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:14px;display:grid;gap:12px;grid-template-columns:1fr auto;grid-template-areas:"who state" "exp exp" "acts acts"}
.who{grid-area:who;min-width:0}
.state{grid-area:state;align-self:start}
.exp{grid-area:exp;display:flex;flex-direction:column;gap:2px}
.acts{grid-area:acts;display:flex;gap:8px}
.acts .btn{flex:1}
.hw{display:block;max-width:100%;font-family:var(--mono);font-size:13px;color:var(--tx);text-align:left;word-break:break-all;line-height:1.4;padding:2px 6px;margin:-2px -6px;border-radius:6px;transition:background .15s}
.hw:hover{background:var(--sf2)}
.hw.copied{color:var(--ok)}
.meta{margin-top:6px;font-size:13px;color:var(--mt);display:flex;flex-wrap:wrap;gap:2px 12px}
.meta b{color:var(--tx);font-weight:600}
.exp .big{font-size:14px;font-weight:700}
.exp .big.warn{color:var(--wn)} .exp .big.bad{color:var(--er)} .exp .big.none{color:var(--dim);font-weight:500}
.exp .small{font-size:12px;color:var(--mt)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.pending{background:rgba(229,169,61,.12);color:var(--wn)}
.pill.approved{background:rgba(76,195,138,.12);color:var(--ok)}
.pill.revoked{background:rgba(242,109,109,.12);color:var(--er)}

@media (min-width:760px){
  body{font-size:14.5px}
  .wrap{padding-top:24px}
  .tools{flex-direction:row;align-items:center;justify-content:space-between}
  .seg{flex:0 1 auto}
  .search{flex:0 1 320px}
  .row{grid-template-columns:minmax(0,1fr) 110px 170px auto;grid-template-areas:"who state exp acts";align-items:center;gap:20px;padding:14px 18px}
  .state{align-self:center}
  .acts .btn{flex:0 0 auto;min-height:36px;padding:0 13px;font-size:13px}
}

/* ---------- empty / skeleton ---------- */
.empty{background:var(--sf);border:1px dashed var(--bd2);border-radius:var(--r);padding:40px 20px;text-align:center}
.empty strong{display:block;font-size:16px;margin-bottom:4px}
.empty p{color:var(--mt);font-size:14px}
.empty .btn{margin-top:14px}
.sk{height:84px;border-radius:var(--r);background:linear-gradient(90deg,var(--sf) 25%,var(--sf2) 50%,var(--sf) 75%);background-size:200% 100%;animation:sk 1.3s linear infinite}
@keyframes sk{to{background-position:-200% 0}}

/* ---------- sheet (modal) ---------- */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(5,8,12,.65);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease-out}
.sheet{width:100%;max-width:440px;background:var(--sf);border:1px solid var(--bd2);border-bottom:0;border-radius:20px 20px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));animation:up .22s cubic-bezier(.2,.8,.2,1);max-height:92dvh;overflow:auto}
.sheet h2{font-size:18px;font-weight:700;margin-bottom:4px}
.sheet .sub{font-family:var(--mono);font-size:12px;color:var(--mt);word-break:break-all;margin-bottom:18px}
.sheet .msg{color:var(--mt);font-size:14px;margin:6px 0 18px}
.plans{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:16px}
.plan{min-height:52px;padding:8px 12px;border-radius:var(--r-s);background:var(--bg);border:1px solid var(--bd);text-align:left;transition:border-color .15s,background .15s}
.plan b{display:block;font-size:14px}
.plan small{font-size:12px;color:var(--mt)}
.plan:hover{border-color:var(--bd2)}
.plan.on{border-color:var(--ac);background:rgba(139,156,255,.1);box-shadow:0 0 0 1px var(--ac) inset}
.sheet .field{margin-bottom:16px}
.sheet-acts{display:flex;gap:10px;margin-top:6px}
.sheet-acts .btn{flex:1;min-height:46px}
@media (min-width:760px){
  .scrim{align-items:center;padding:20px}
  .sheet{border-bottom:1px solid var(--bd2);border-radius:20px;animation:pop .18s ease-out}
  .plans{grid-template-columns:repeat(4,1fr)}
  .sheet{max-width:480px}
}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes pop{from{transform:scale(.97);opacity:0}}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--sf3);border:1px solid var(--bd2);color:var(--tx);padding:11px 18px;border-radius:12px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:99;max-width:90vw;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.4)}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.bad{border-color:var(--er);color:#FFB4B4}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<main id="v-login" class="login" hidden>
  <div class="login-card">
    <div class="brand">
      <div class="mark">pt</div>
      <div><h1>pt.Live</h1><p>Quản lý bản quyền</p></div>
    </div>
    <label class="field">
      <span>Mật khẩu admin</span>
      <div class="pwrap">
        <input class="input" type="password" id="pwd" placeholder="Nhập mật khẩu" autocomplete="current-password">
        <button type="button" id="pwdEye" aria-label="Hiện mật khẩu">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </label>
    <label class="rem"><input type="checkbox" id="remember"><span>Ghi nhớ mật khẩu trên máy này</span></label>
    <div class="lerr" id="lerr" role="alert"></div>
    <button class="btn primary" id="bl">Đăng nhập</button>
  </div>
</main>

<!-- ============ PANEL ============ -->
<div id="v-panel" hidden>
  <header class="bar">
    <div class="bar-in">
      <div class="brand">
        <div class="mark">pt</div>
        <div><h1>pt.Live</h1><p>Quản lý bản quyền</p></div>
      </div>
      <div class="bar-r">
        <button class="btn ghost sm" id="brf" aria-label="Tải lại danh sách">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.35-5.65"/><path d="M20 4v5h-5"/></svg>
        </button>
        <button class="btn sm" id="blg">Đăng xuất</button>
      </div>
    </div>
  </header>

  <div class="wrap">
    <div class="tools">
      <div class="seg" id="seg" role="tablist">
        <button class="on" data-s="pending">Chờ duyệt<span class="n" id="n-pending">0</span></button>
        <button data-s="approved">Đã duyệt<span class="n" id="n-approved">0</span></button>
        <button data-s="revoked">Thu hồi<span class="n" id="n-revoked">0</span></button>
        <button data-s="">Tất cả<span class="n" id="n-all">0</span></button>
      </div>
      <label class="search">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input class="input" id="q" type="search" placeholder="Tìm mã máy, tên khách, ghi chú" autocomplete="off">
      </label>
    </div>

    <div id="list" class="list"></div>
  </div>
</div>

<!-- ============ DUYỆT ============ -->
<div id="modal" class="scrim" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="m-title">
    <h2 id="m-title">Duyệt máy</h2>
    <div class="sub" id="m-hwid"></div>
    <div class="plans" id="m-chips">
      <button type="button" class="plan on" data-plan="m1"><b>1 tháng</b><small>30 ngày</small></button>
      <button type="button" class="plan" data-plan="m6"><b>6 tháng</b><small>180 ngày</small></button>
      <button type="button" class="plan" data-plan="y1"><b>1 năm</b><small>365 ngày</small></button>
      <button type="button" class="plan" data-plan="custom"><b>Tùy chọn</b><small>Nhập số ngày</small></button>
    </div>
    <label class="field" id="m-custom" hidden>
      <span>Số ngày</span>
      <input class="input" type="number" id="m-days" placeholder="Ví dụ 45" min="1" inputmode="numeric">
    </label>
    <label class="field">
      <span>Ghi chú (tên khách, quán…)</span>
      <input class="input" type="text" id="m-note" placeholder="Ví dụ: Quán Karaoke ABC" maxlength="120" autocomplete="off">
    </label>
    <div class="sheet-acts">
      <button class="btn" id="m-cancel">Hủy</button>
      <button class="btn good" id="m-ok">Duyệt</button>
    </div>
  </div>
</div>

<!-- ============ GIA HẠN ============ -->
<div id="modal-extend" class="scrim" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="e-title">
    <h2 id="e-title">Gia hạn bản quyền</h2>
    <div class="sub" id="e-hwid"></div>
    <div class="plans" id="e-plans">
      <button type="button" class="plan on" data-plan="1"><b>1 tháng</b><small>30 ngày</small></button>
      <button type="button" class="plan" data-plan="6"><b>6 tháng</b><small>180 ngày</small></button>
      <button type="button" class="plan" data-plan="12"><b>1 năm</b><small>365 ngày</small></button>
      <button type="button" class="plan" data-plan="custom"><b>Tùy chọn</b><small>Nhập số ngày</small></button>
    </div>
    <label class="field" id="e-custom" hidden style="margin-top:12px">
      <span>Số ngày</span>
      <input class="input" type="number" id="e-days" placeholder="Ví dụ 45" min="1" inputmode="numeric">
    </label>
    <div class="sheet-acts">
      <button class="btn" id="e-cancel">Hủy</button>
      <button class="btn primary" id="e-ok">Gia hạn</button>
    </div>
  </div>
</div>

<!-- ============ XÁC NHẬN ============ -->
<div id="confirm" class="scrim" hidden>
  <div class="sheet" role="alertdialog" aria-modal="true" aria-labelledby="c-title">
    <h2 id="c-title">Thu hồi bản quyền?</h2>
    <p class="msg" id="c-msg"></p>
    <div class="sheet-acts">
      <button class="btn" id="c-cancel">Hủy</button>
      <button class="btn danger" id="c-ok">Thu hồi</button>
    </div>
  </div>
</div>

<div id="toast" role="status"></div>

<script>
var TOKEN = '', API = '/api/license';
var ALL = [], curStatus = 'pending', curPlan = 'm1', approving = '';

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function toast(m, bad){
  var t = $('toast'); t.textContent = m; t.className = 'show' + (bad ? ' bad' : '');
  clearTimeout(toast._t); toast._t = setTimeout(function(){ t.className = ''; }, 2600);
}
function fmt(ts){
  if (!ts) return '-';
  return new Date(ts * 1000).toLocaleString('vi-VN', {day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit'});
}
function api(path, opt){
  opt = opt || {}; opt.headers = Object.assign({'X-Admin-Token': TOKEN}, opt.headers || {});
  return fetch(API + path, opt);
}
function post(path, body){
  return api(path, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)})
    .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(j){ return {s:r.status, j:j}; }); });
}

/* ---------- saved password ----------
   "Ghi nhớ" ticked  -> localStorage   (stays after the browser is closed)
   not ticked        -> sessionStorage (gone when the tab is closed, as before) */
function savedToken(){
  try { return localStorage.getItem('ptl_tok') || sessionStorage.getItem('ptl_tok') || ''; } catch(e){ return ''; }
}
function saveToken(tok, remember){
  try {
    localStorage.removeItem('ptl_tok'); sessionStorage.removeItem('ptl_tok');
    (remember ? localStorage : sessionStorage).setItem('ptl_tok', tok);
    if (remember) localStorage.setItem('ptl_rem', '1'); else localStorage.removeItem('ptl_rem');
  } catch(e){}
}
function clearToken(){
  try { localStorage.removeItem('ptl_tok'); sessionStorage.removeItem('ptl_tok'); } catch(e){}
}

/* ---------- login ---------- */
function showLogin(){
  $('v-panel').hidden = true; $('v-login').hidden = false; $('pwd').value = '';
  try { $('remember').checked = localStorage.getItem('ptl_rem') === '1'; } catch(e){}
  $('pwd').focus();
}
function showPanel(){ $('v-login').hidden = true; $('v-panel').hidden = false; load(); }

$('bl').onclick = function(){
  var p = $('pwd').value.trim();
  if (!p){ $('lerr').textContent = 'Nhập mật khẩu admin.'; return; }
  $('lerr').textContent = ''; $('bl').disabled = true; TOKEN = p;
  api('/admin/list?status=pending')
    .then(function(r){
      $('bl').disabled = false;
      if (r.status !== 200){ $('lerr').textContent = 'Mật khẩu không đúng.'; TOKEN = ''; return; }
      saveToken(TOKEN, $('remember').checked); showPanel();
    })
    .catch(function(){ $('bl').disabled = false; $('lerr').textContent = 'Không kết nối được máy chủ.'; TOKEN = ''; });
};
$('pwd').addEventListener('keydown', function(e){ if (e.key === 'Enter') $('bl').click(); });
$('pwdEye').onclick = function(){ var p = $('pwd'); p.type = p.type === 'password' ? 'text' : 'password'; p.focus(); };
$('blg').onclick = function(){ clearToken(); TOKEN = ''; ALL = []; showLogin(); };
$('brf').onclick = function(){ load(true); };

/* ---------- filters ---------- */
$('seg').onclick = function(e){
  var b = e.target.closest('button'); if (!b) return;
  curStatus = b.getAttribute('data-s');
  [].forEach.call($('seg').children, function(x){ x.classList.toggle('on', x === b); });
  render();
};
$('q').addEventListener('input', render);

/* ---------- data ---------- */
function load(manual){
  if (!ALL.length) $('list').innerHTML = '<div class="sk"></div><div class="sk"></div><div class="sk"></div>';
  api('/admin/list').then(function(r){
    if (r.status === 401 || r.status === 403){ toast('Phiên đã hết hạn, đăng nhập lại.', true); clearToken(); TOKEN = ''; showLogin(); return null; }
    return r.ok ? r.json() : {items:[]};
  }).then(function(j){
    if (!j) return;
    ALL = (j.items || []).slice().sort(function(a, b){ return (b.last_seen || 0) - (a.last_seen || 0); });
    render(); if (manual) toast('Đã tải lại danh sách');
  }).catch(function(){
    $('list').innerHTML = '<div class="empty"><strong>Không tải được danh sách</strong><p>Kiểm tra kết nối rồi thử lại.</p><button class="btn" id="retry">Tải lại</button></div>';
    $('retry').onclick = function(){ load(); };
  });
}

var LABEL = {pending:'Chờ duyệt', approved:'Đã duyệt', revoked:'Đã thu hồi'};

function expiry(it){
  if (!it.expires_at) return {big:'Chưa có hạn', cls:'none', small:''};
  var diff = it.expires_at * 1000 - Date.now();
  var small = 'Hết hạn ' + fmt(it.expires_at);
  if (diff <= 0) return {big:'Đã hết hạn', cls:'bad', small:small};
  var d = Math.ceil(diff / 86400000);
  return {big:'Còn ' + d + ' ngày', cls: d <= 7 ? 'warn' : '', small:small};
}

function render(){
  var counts = {pending:0, approved:0, revoked:0};
  ALL.forEach(function(it){ var s = it.status || 'pending'; if (counts[s] != null) counts[s]++; });
  $('n-pending').textContent = counts.pending; $('n-pending').classList.toggle('has', counts.pending > 0);
  $('n-approved').textContent = counts.approved;
  $('n-revoked').textContent = counts.revoked;
  $('n-all').textContent = ALL.length;

  var q = $('q').value.trim().toLowerCase();
  var items = ALL.filter(function(it){
    if (curStatus && (it.status || 'pending') !== curStatus) return false;
    if (!q) return true;
    return [it.hwid, it.hw_label, it.note, it.app_version, it.phone].join(' ').toLowerCase().indexOf(q) >= 0;
  });

  var box = $('list');
  if (!items.length){
    var none = q ? 'Không tìm thấy máy nào khớp “' + esc(q) + '”.'
                 : (curStatus === 'pending' ? 'Không có máy nào đang chờ duyệt.' : 'Chưa có máy nào trong mục này.');
    box.innerHTML = '<div class="empty"><strong>Trống</strong><p>' + none + '</p></div>';
    return;
  }

  box.innerHTML = items.map(function(it){
    var st = it.status || 'pending', ex = expiry(it), h = esc(it.hwid);
    var meta = [];
    if (it.note) meta.push('<b>' + esc(it.note) + '</b>');
    if (it.hw_label) meta.push(esc(it.hw_label));
    if (it.app_version) meta.push('v' + esc(it.app_version).replace(/^v/i, ''));
    if (it.requested_at && st !== 'approved') meta.push('<b style="color:var(--wn)">📩 Gửi yêu cầu ' + fmt(it.requested_at) + '</b>');
    if (it.phone) meta.push('<a href="tel:' + esc(it.phone) + '" style="color:var(--ok);text-decoration:none">' + esc(it.phone) + ' 📞</a>');
    meta.push('Hoạt động ' + fmt(it.last_seen));
    var acts = '';
    if (st === 'pending') acts += '<button class="btn good sm" data-act="approve" data-h="' + h + '">Duyệt</button>';
    if (st === 'revoked') acts += '<button class="btn good sm" data-act="approve" data-h="' + h + '">Duyệt lại</button>';
    if (st !== 'pending') acts += '<button class="btn sm" data-act="extend" data-h="' + h + '">Gia hạn</button>';
    if (st !== 'revoked') acts += '<button class="btn danger sm" data-act="revoke" data-h="' + h + '">Thu hồi</button>';
    return '<article class="row">' +
      '<div class="who"><button class="hw" data-copy="' + h + '" title="Chạm để sao chép">' + h + '</button>' +
      '<div class="meta">' + meta.map(function(m){ return '<span>' + m + '</span>'; }).join('') + '</div></div>' +
      '<div class="state"><span class="pill ' + esc(st) + '">' + (LABEL[st] || esc(st)) + '</span></div>' +
      '<div class="exp"><span class="big ' + ex.cls + '">' + ex.big + '</span>' + (ex.small ? '<span class="small">' + ex.small + '</span>' : '') + '</div>' +
      '<div class="acts">' + acts + '</div></article>';
  }).join('');
}

$('list').onclick = function(e){
  var c = e.target.closest('[data-copy]');
  if (c){
    var v = c.getAttribute('data-copy');
    (navigator.clipboard ? navigator.clipboard.writeText(v) : Promise.reject()).then(function(){
      c.classList.add('copied'); toast('Đã sao chép mã máy'); setTimeout(function(){ c.classList.remove('copied'); }, 1200);
    }).catch(function(){
      var r = document.createRange(); r.selectNodeContents(c); var s = getSelection(); s.removeAllRanges(); s.addRange(r);
    });
    return;
  }
  var b = e.target.closest('[data-act]'); if (!b) return;
  var h = b.getAttribute('data-h'), act = b.getAttribute('data-act');
  if (act === 'approve') openApprove(h);
  else if (act === 'extend') doExtend(h);
  else if (act === 'revoke') askRevoke(h);
};

/* ---------- approve ---------- */
function openApprove(h){
  approving = h; curPlan = 'm1';
  $('m-hwid').textContent = h;
  [].forEach.call($('m-chips').children, function(x){ x.classList.toggle('on', x.getAttribute('data-plan') === 'm1'); });
  $('m-custom').hidden = true; $('m-days').value = '';
  var cur = ALL.filter(function(i){ return i.hwid === h; })[0];
  $('m-note').value = (cur && cur.note) || '';
  $('modal').hidden = false;
  setTimeout(function(){ $('m-note').focus(); }, 60);
}
$('m-chips').onclick = function(e){
  var c = e.target.closest('.plan'); if (!c) return;
  [].forEach.call($('m-chips').children, function(x){ x.classList.toggle('on', x === c); });
  curPlan = c.getAttribute('data-plan');
  $('m-custom').hidden = curPlan !== 'custom';
  if (curPlan === 'custom') $('m-days').focus();
};
$('m-cancel').onclick = function(){ $('modal').hidden = true; };
$('m-ok').onclick = function(){
  var body = {hwid: approving, plan: curPlan, note: $('m-note').value.trim()};
  if (curPlan === 'custom'){
    var d = parseInt($('m-days').value, 10);
    if (!(d > 0)){ toast('Nhập số ngày hợp lệ', true); $('m-days').focus(); return; }
    body.days = d;
  }
  var h = approving; $('m-ok').disabled = true;
  post('/admin/approve', body).then(function(o){
    $('m-ok').disabled = false; $('modal').hidden = true;
    if (o.s === 200){ toast('Đã duyệt máy ' + h.slice(0, 8) + '…'); load(); }
    else toast('Lỗi: ' + (o.j.error || o.s), true);
  }).catch(function(){ $('m-ok').disabled = false; toast('Không kết nối được máy chủ', true); });
};

/* ---------- extend / revoke ---------- */
var extending = '', curExtendPlan = '1';
var PLAN_DAYS = { '1': 30, '6': 180, '12': 365 };

function doExtend(h){
  extending = h; curExtendPlan = '1';
  $('e-hwid').textContent = h;
  [].forEach.call($('e-plans').children, function(x){ x.classList.toggle('on', x.getAttribute('data-plan') === '1'); });
  $('e-custom').hidden = true; $('e-days').value = '';
  $('modal-extend').hidden = false;
}
$('e-plans').onclick = function(e){
  var c = e.target.closest('.plan'); if (!c) return;
  [].forEach.call($('e-plans').children, function(x){ x.classList.toggle('on', x === c); });
  curExtendPlan = c.getAttribute('data-plan');
  $('e-custom').hidden = curExtendPlan !== 'custom';
  if (curExtendPlan === 'custom') $('e-days').focus();
};
$('e-cancel').onclick = function(){ $('modal-extend').hidden = true; };
$('e-ok').onclick = function(){
  var days = PLAN_DAYS[curExtendPlan];
  if (curExtendPlan === 'custom'){
    days = parseInt($('e-days').value, 10);
    if (!(days > 0)){ toast('Nhập số ngày hợp lệ', true); $('e-days').focus(); return; }
  }
  var h = extending; $('e-ok').disabled = true;
  post('/admin/extend', {hwid: h, days: days}).then(function(o){
    $('e-ok').disabled = false; $('modal-extend').hidden = true;
    if (o.s === 200){ toast('Đã gia hạn thêm ' + days + ' ngày'); load(); }
    else toast('Lỗi: ' + (o.j.error || o.s), true);
  }).catch(function(){ $('e-ok').disabled = false; toast('Không kết nối được máy chủ', true); });
};
var revoking = '';
function askRevoke(h){
  revoking = h;
  $('c-msg').textContent = 'Máy ' + h.slice(0, 12) + '… sẽ không còn dùng được pt.Live cho đến khi bạn duyệt lại.';
  $('confirm').hidden = false;
}
$('c-cancel').onclick = function(){ $('confirm').hidden = true; };
$('c-ok').onclick = function(){
  var h = revoking; $('c-ok').disabled = true;
  post('/admin/revoke', {hwid: h}).then(function(o){
    $('c-ok').disabled = false; $('confirm').hidden = true;
    if (o.s === 200){ toast('Đã thu hồi'); load(); }
    else toast('Lỗi: ' + (o.j.error || o.s), true);
  }).catch(function(){ $('c-ok').disabled = false; toast('Không kết nối được máy chủ', true); });
};

/* ---------- sheets: backdrop + Esc ---------- */
['modal', 'modal-extend', 'confirm'].forEach(function(id){
  $(id).addEventListener('mousedown', function(e){ if (e.target === this) this.hidden = true; });
});
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape'){ $('modal').hidden = true; $('modal-extend').hidden = true; $('confirm').hidden = true; }
});

/* ---------- boot ---------- */
if (savedToken()){ TOKEN = savedToken(); showPanel(); }
else showLogin();
</script>
</body>
</html>

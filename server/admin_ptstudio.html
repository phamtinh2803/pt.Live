<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0D1117">
<title>PT Studio - License Admin</title>
<style>
:root{--bg:#0D1117;--sf:#161B22;--sf2:#1C2128;--bd:#30363D;--tx:#E6EDF3;--mt:#7D8590;--ac:#58A6FF;--ack:#388BFD;--ok:#3FB950;--er:#F85149}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--tx);font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh}
.w{max-width:520px;margin:0 auto;padding:16px 14px 40px}
.hdr{display:flex;align-items:center;justify-content:space-between;background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.hdr h1{font-size:17px;font-weight:700}.hdr small{display:block;font-size:11px;color:var(--mt);margin-top:2px}
.btn-o{background:none;border:1px solid var(--bd);color:var(--mt);border-radius:8px;padding:7px 11px;font-size:12px;font-weight:600}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.lbl{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--mt);margin-bottom:8px}
input,select{width:100%;background:var(--sf2);border:1px solid var(--bd);border-radius:10px;color:var(--tx);padding:13px 12px;font-size:15px;outline:none}
input:focus,select:focus{border-color:var(--ac)}
.mid-r{display:flex;gap:8px}
.mid-r input{font-family:ui-monospace,Consolas,monospace;letter-spacing:.5px}
.btn-p{flex-shrink:0;background:var(--sf2);border:1px solid var(--bd);color:var(--mt);border-radius:10px;padding:0 14px;font-size:12px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--sf2);border:1px solid var(--bd);color:var(--mt);border-radius:999px;padding:9px 16px;font-size:13px;font-weight:700;cursor:pointer}
.chip.on{background:var(--ac);border-color:var(--ac);color:#0D1117}
.btn-m{width:100%;background:var(--ac);color:#0D1117;border:none;border-radius:12px;padding:15px;font-size:15px;font-weight:800;cursor:pointer}
.btn-m:disabled{opacity:.55}
.rk{background:#010409;border:1px solid var(--bd);border-radius:10px;padding:14px 12px;font-family:ui-monospace,Consolas,monospace;font-size:13px;line-height:1.6;word-break:break-all;color:#58A6FF}
.rm{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.pl{font-size:11px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--sf2);color:var(--mt);border:1px solid var(--bd)}
.pl.ok{color:var(--ok);border-color:rgba(63,185,80,.4)}
.btn-c{margin-top:10px;width:100%;background:var(--sf2);border:1px solid var(--bd);color:var(--tx);border-radius:10px;padding:12px;font-size:13px;font-weight:700;cursor:pointer}
.hi{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--bd)}
.hi:last-child{border-bottom:none}
.hm{flex:1;min-width:0}
.hm-mid{font-family:ui-monospace,Consolas,monospace;font-size:11px;color:var(--tx);word-break:break-all}
.hm-sub{font-size:11px;color:var(--mt);margin-top:3px}
.hc{flex-shrink:0;background:var(--sf2);border:1px solid var(--bd);color:var(--mt);border-radius:8px;padding:8px 12px;font-size:11px;font-weight:700;cursor:pointer}
.empty{color:var(--mt);font-size:13px;text-align:center;padding:18px 0}
.lw{max-width:360px;margin:0 auto;padding-top:10vh}
.remember{display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;color:var(--mt);margin-top:10px;cursor:pointer;user-select:none}
.remember input{width:16px;height:16px;accent-color:var(--ac);cursor:pointer}
.err{color:var(--er);font-size:12px;margin-top:8px;min-height:16px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:var(--sf2);border:1px solid var(--bd);color:var(--tx);padding:10px 18px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .25s;z-index:99;max-width:90vw;text-align:center}
#toast.show{opacity:1}
#toast.bad{border-color:var(--er);color:var(--er)}
</style>
</head>
<body>
<div class="w">
  <!-- LOGIN -->
  <div id="v-login" class="lw" hidden>
    <div class="card">
      <div style="font-size:26px;text-align:center;margin-bottom:6px">&#128274;</div>
      <h2 style="text-align:center;font-size:16px;margin-bottom:2px">PT Studio License Admin</h2>
      <p style="text-align:center;font-size:12px;color:var(--mt);margin-bottom:16px">Đăng nhập để cấp key</p>
      <input type="password" id="pwd" placeholder="Mật khẩu admin" autocomplete="current-password">
      <label class="remember"><input type="checkbox" id="rem" checked> Ghi nhớ mật khẩu</label>
      <div class="err" id="lerr"></div>
      <button class="btn-m" id="bl" style="margin-top:4px">Đăng nhập</button>
    </div>
  </div>

  <!-- PANEL -->
  <div id="v-panel" hidden>
    <div class="hdr">
      <div><h1>&#128274; License Admin</h1><small>PT Studio</small></div>
      <button class="btn-o" id="blg">Đăng xuất</button>
    </div>

    <div class="card">
      <div class="lbl">MACHINE ID (user gửi)</div>
      <div class="mid-r">
        <input type="text" id="mid" placeholder="32 ký tự hex" autocapitalize="characters" autocomplete="off" spellcheck="false">
        <button class="btn-p" id="bp">Dán</button>
      </div>
    </div>

    <div class="card">
      <div class="lbl">HẠN DÙNG</div>
      <div class="chips" id="chips"></div>
    </div>

    <button class="btn-m" id="bg">&#9889; Tạo License</button>

    <div class="card" id="res" style="display:none;margin-top:14px">
      <div class="lbl">LICENSE KEY</div>
      <div class="rk" id="rkey"></div>
      <div class="rm" id="rmeta"></div>
      <button class="btn-c" id="bc">📋 Copy key</button>
    </div>

    <div class="card" style="margin-top:14px">
      <div class="lbl">LỊCH SỬ KEY ĐÃ CẤP</div>
      <input type="text" id="sq" placeholder="Tìm Machine ID..." style="margin-bottom:6px">
      <div id="ht"></div>
    </div>
  </div>
</div>
<div id="toast"></div>
<script>
var P=[["7days","7 ngày",7],["1month","1 tháng",30],["6months","6 tháng",182],["1year","1 năm",365],["forever","Vĩnh viễn",0]];
var sp="7days",tk=localStorage.getItem("lt")||sessionStorage.getItem("lt")||"";
var $=id=>document.getElementById(id),te=$("toast"),tt;
function toast(m,b){te.textContent=m;te.className="show"+(b?" bad":"");clearTimeout(tt);tt=setTimeout(()=>te.className="",1800)}
async function api(p,o){o=o||{};var h={"Content-Type":"application/json"};if(tk)h["X-Admin-Token"]=tk;var r=await fetch(p,Object.assign({},o,{headers:h}));if(r.status===401){showL();throw new Error("Sai mật khẩu admin")}var d={};try{d=await r.json()}catch(e){}if(!r.ok)throw new Error(d.detail||("Lỗi "+r.status));return d}
function showL(){tk="";localStorage.removeItem("lt");sessionStorage.removeItem("lt");$("v-panel").hidden=true;$("v-login").hidden=false}
function showP(){$("v-login").hidden=true;$("v-panel").hidden=false}
function login(){var p=$("pwd").value;$("lerr").textContent="";tk=p;api("/api/admin/licenses").then(function(){var st=$("rem").checked?localStorage:sessionStorage;st.setItem("lt",tk);showP();loadH()}).catch(function(e){tk="";$("lerr").textContent=e.message})}
$("bl").onclick=login;
$("pwd").addEventListener("keydown",function(e){if(e.key==="Enter")login()});
var ch=$("chips");
P.forEach(function(v){var b=document.createElement("button");b.className="chip"+(v[0]===sp?" on":"");b.textContent=v[1];b.onclick=function(){sp=v[0];Array.prototype.forEach.call(ch.children,function(c){c.classList.remove("on")});b.classList.add("on")};ch.appendChild(b)});
function days(){for(var i=0;i<P.length;i++)if(P[i][0]===sp)return P[i][2];return 7}
$("bp").onclick=function(){navigator.clipboard.readText().then(function(t){$("mid").value=t.trim().toUpperCase()}).catch(function(){toast("Dán thủ công",true)})};
$("bg").onclick=function(){var m=$("mid").value.trim().toUpperCase();if(!/^[0-9A-F]{32}$/.test(m)){toast("Machine ID phải đúng 32 ký tự hex",true);return}var b=$("bg");b.disabled=true;b.textContent="Đang tạo...";api("/api/admin/licenses",{method:"POST",body:JSON.stringify({machine_id:m,days:days()})}).then(function(d){$("rkey").textContent=d.license_key;var pl="";for(var i=0;i<P.length;i++)if(P[i][0]===sp)pl=P[i][1];$("rmeta").innerHTML='<span class="pl ok">'+pl+'</span>'+(d.expiry?'<span class="pl">đến '+d.expiry+'</span>':'');$("res").style.display="";return navigator.clipboard.writeText(d.license_key).then(function(){toast("Đã tạo và copy key")}).catch(function(){toast("Đã tạo key - bấm Copy")})}).catch(function(e){toast(e.message,true)}).finally(function(){b.disabled=false;b.innerHTML="&#9889; Tạo License";loadH()})};
$("bc").onclick=function(){navigator.clipboard.writeText($("rkey").textContent).then(function(){toast("Đã copy")}).catch(function(){toast("Lỗi copy",true)})};
var st;$("sq").oninput=function(){if(tk){clearTimeout(st);st=setTimeout(loadH,250)}};
function loadH(){var q=$("sq").value.trim();api("/api/admin/licenses"+(q?("?q="+encodeURIComponent(q)):"")).then(function(d){var h=$("ht");if(!d.items.length){h.innerHTML='<div class="empty">Chưa có key nào</div>';return}h.innerHTML=d.items.map(function(x){return '<div class="hi"><div class="hm"><div class="hm-mid">'+x.machine_id+'</div><div class="hm-sub">'+(x.expiry||"Vĩnh viễn")+" · "+x.created_at+'</div></div><button class="hc" data-k="'+x.license_key+'">Copy</button></div>'}).join("");Array.prototype.forEach.call(h.querySelectorAll(".hc"),function(b){b.onclick=function(){navigator.clipboard.writeText(b.getAttribute("data-k")).then(function(){toast("Đã copy")}).catch(function(){toast("Lỗi",true)})}})}).catch(function(){})}
$("blg").onclick=showL;
(function(){if(!tk){showL();return}api("/api/admin/licenses").then(function(){showP();loadH()}).catch(function(){showL()})})();
</script>
</body>
</html>

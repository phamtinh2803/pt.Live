# pt.Live Auto-Update Release Workflow
#
# This workflow automates the release process for pt.Live's auto-update system.
# It publishes the installer to GitHub Releases and updates the manifest.
#
# Prerequisites:
#   - Installer must be built locally and uploaded as a release asset
#   - update.json must be updated in release/ directory before tagging
#
# Usage:
#   1. Update version in CMakeLists.txt + setup.iss
#   2. Build installer (setup.iss -> installer/pt.Live-X.Y.Z.exe)
#   3. Update release/update.json with version, url, sha256
#   4. Commit and tag: git tag -a vX.Y.Z -m "..."
#   5. Push: git push && git push --tags
#   6. GitHub Actions will verify the manifest and create the release

name: pt.Live Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.1.1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  verify-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify update.json exists and is valid
        run: |
          if [ ! -f release/update.json ]; then
            echo "::error::release/update.json not found"
            exit 1
          fi

          # Validate JSON
          cat release/update.json | jq empty || {
            echo "::error::release/update.json is not valid JSON"
            exit 1
          }

          echo "✅ update.json is valid"
          cat release/update.json

      - name: Expected version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          JSON_VERSION=$(jq -r '.version' release/update.json)
          if [ "$TAG" != "$JSON_VERSION" ]; then
            echo "::error::Tag version ($TAG) doesn't match update.json version ($JSON_VERSION)"
            exit 1
          fi
          echo "✅ Version matches: $TAG"

  create-release:
    needs: verify-manifest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from tag or input
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: pt.Live v${{ steps.version.outputs.version }}
          body_path: release/update.json
          draft: false
          prerelease: false
          files: |
            installer/pt.Live-${{ steps.version.outputs.version }}.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify success
        run: |
          echo "🎉 Release v${{ steps.version.outputs.version }} created successfully!"
          echo ""
          echo "Auto-update manifest: https://raw.githubusercontent.com/PT-STUDIO/pt.live/main/release/update.json"
          echo "Users will see the update dialog on next launch."
